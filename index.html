
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oksana & Guy | Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Italianno&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: #eee8df;
      color: #44382f;
      overflow-x: hidden;
    }

    .cover {
      position: relative;
      min-height: 100svh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 18px;
      background:
        linear-gradient(
          135deg,
          rgba(35, 27, 22, 0.12),
          rgba(35, 27, 22, 0.30)
        ),
        url("images/cover.jpg") center center / cover no-repeat;
      isolation: isolate;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(35, 29, 24, 0.08);
      z-index: -1;
    }

    .frame {
      position: relative;
      width: min(100%, 570px);
      padding: 37px 30px 32px;
      text-align: center;

      background: rgba(250, 247, 241, 0.84);
      border: 1px solid rgba(190, 160, 112, 0.8);
      outline: 1px solid rgba(255, 250, 239, 0.7);
      outline-offset: 6px;

      box-shadow:
        0 18px 55px rgba(25, 19, 14, 0.15),
        inset 0 0 35px rgba(255, 255, 255, 0.18);

      animation: frameReveal 1.2s ease-out both;
    }

    .eyebrow {
      margin: 0 0 22px;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 4px;
      line-height: 1.8;
      text-transform: uppercase;
      color: #897354;
      animation: fadeUp 1s 0.15s both;
    }

    .monogram {
      margin: 0 0 13px;
      font-family: "Italianno", cursive;
      font-size: 37px;
      line-height: 1;
      color: #a18455;
      text-shadow: 0 2px 7px rgba(133, 103, 58, 0.16);
      animation: fadeUp 1s 0.25s both;
    }

    .names {
      margin: 0;
      font-family: "Italianno", serif;
      font-size: clamp(37px, 6vw, 55px);
      font-weight: 555;
      line-height: 1.22;
      letter-spacing: 0.3px;
      color: #4a3c31;
      text-shadow: 0 2px 9px rgba(93, 68, 43, 0.13);
      animation: nameReveal 1.35s 0.35s both;
    }

    .name {
      display: block;
      white-space: nowrap;
    }

    .ampersand {
      display: block;
      margin: -1px 0 0;
      font-family: "Italianno", cursive;
      font-size: 39px;
      font-weight: 400;
      line-height: 1.05;
      color: #a18455;
      text-shadow: 0 2px 8px rgba(133, 103, 58, 0.18);
    }

    .divider {
      width: 66px;
      height: 1px;
      margin: 21px auto 19px;
      background: linear-gradient(
        to right,
        transparent,
        #b39a70,
        transparent
      );
      animation: fadeUp 1s 0.65s both;
    }

    .subtitle {
      margin: 0;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 3.2px;
      line-height: 1.9;
      text-transform: uppercase;
      color: #76634d;
      animation: fadeUp 1s 0.7s both;
    }

    .date {
      display: block;
      margin: 15px auto 0;
      font-family: "Bodoni Moda", serif;
      font-size: clamp(19px, 3.2vw, 23px);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 1.8px;
      color: #92764c;
      white-space: normal;
      overflow-wrap: normal;
      text-shadow: 0 1px 5px rgba(123, 91, 47, 0.13);
      animation: dateReveal 1.2s 0.8s both;
    }

    .open-button {
      display: inline-block;
      margin-top: 27px;
      padding: 13px 25px;
      border: 1px solid #a58b62;
      background: rgba(255, 255, 255, 0.35);
      color: #65513a;

      font-family: "Montserrat", sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      text-decoration: none;

      transition:
        background 0.35s ease,
        color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;

      animation: fadeUp 1s 1s both;
    }

    .open-button:hover {
      background: #a58b62;
      color: #fffdf8;
      box-shadow: 0 5px 18px rgba(103, 78, 43, 0.18);
      transform: translateY(-2px);
    }

    .bottom-note {
      margin: 21px 0 0;
      font-family: "Italianno", cursive;
      font-size: 23px;
      line-height: 1.2;
      color: #907650;
      animation: fadeUp 1s 1.1s both;
    }

    .page-leaving {
      animation: pageFadeOut 0.6s ease forwards;
      pointer-events: none;
    }

    @keyframes frameReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes nameReveal {
      from {
        opacity: 0;
        transform: translateY(18px);
        letter-spacing: 2px;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 0.3px;
      }
    }

    @keyframes dateReveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pageFadeOut {
      to {
        opacity: 0;
        transform: scale(1.015);
      }
    }

    @media (max-width: 480px) {
      .cover {
        padding: 27px 18px;
      }

      .frame {
        width: 100%;
        padding: 31px 17px 27px;
        outline-offset: 4px;
      }

      .eyebrow {
        margin-bottom: 19px;
        font-size: 8px;
        letter-spacing: 2.8px;
      }

      .monogram {
        font-size: 33px;
      }

      .names {
        font-size: clamp(34px, 10vw, 43px);
        line-height: 1.25;
      }

      .ampersand {
        font-size: 34px;
      }

      .divider {
        margin-top: 19px;
        margin-bottom: 17px;
      }

      .subtitle {
        font-size: 8px;
        letter-spacing: 2.1px;
      }

      .date {
        margin-top: 13px;
        font-size: 19px;
        letter-spacing: 1.1px;
        line-height: 1.65;
      }

      .open-button {
        margin-top: 23px;
        padding: 12px 19px;
        font-size: 8px;
        letter-spacing: 1.8px;
      }

      .bottom-note {
        margin-top: 18px;
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="cover">
    <section class="frame">
      <p class="eyebrow">Together with their families</p>

      <p class="monogram">A celebration of love</p>

      <h1 class="names">
        <span class="name">Oksana</span>
        <span class="ampersand">&</span>
        <span class="name">Guy</span>
      </h1>

      <div class="divider"></div>

      <p class="subtitle">Joyfully invite you to celebrate their wedding</p>

      <!-- Replace with your actual wedding date -->
      <p class="date">10. 12. 2026</p>

      <a class="open-button" href="invitation.html" id="openInvitation">
        Open Invitation
      </a>

      <p class="bottom-note">With love, always</p>
    </section>
  </main>

  <script>
    const invitationLink = document.getElementById("openInvitation");

    invitationLink.addEventListener("click", function (event) {
      event.preventDefault();

      const destination = this.href;
      document.body.classList.add("page-leaving");

      window.setTimeout(function () {
        window.location.href = destination;
      }, 600);
    });
  </script>
</body>
</html>

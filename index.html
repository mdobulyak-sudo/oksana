```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4ed">

  <title>Oksana & Guy — Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Italianno&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f8f4ed;
      color: #4a4038;
      overflow: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* ENVELOPE SCREEN */

    .envelope-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          #fffdf8 0%,
          #f5eee3 70%,
          #e9ddcd 100%
        );
      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    .envelope-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-stage {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope-image {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      inset: 0;
      opacity: 1;
      transition:
        opacity 1s ease,
        transform 1.4s ease;
    }

    .envelope-image.fade {
      opacity: 0;
      transform: scale(1.04);
    }

    .seal-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(64px, 12%, 110px);
      aspect-ratio: 1;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      transition:
        transform 0.35s ease,
        opacity 0.6s ease;
    }

    .seal-button:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .seal-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 5px rgba(62, 39, 24, 0.18));
    }

    .seal-button.hide {
      opacity: 0;
      pointer-events: none;
    }

    .envelope-hint {
      position: absolute;
      bottom: 4%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8a7967;
      animation: hintPulse 2s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% {
        opacity: 0.55;
      }
      50% {
        opacity: 1;
      }
    }

    /* WEDDING COVER */

    .cover {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background-color: #e8ded0;
      background-image:
        linear-gradient(
          rgba(248, 244, 237, 0.20),
          rgba(248, 244, 237, 0.20)
        ),
        url("images/cover.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 1.4s ease,
        visibility 1.4s ease;
    }

    .cover.show {
      opacity: 1;
      visibility: visible;
    }

    .cover-content {
      width: min(100%, 700px);
      text-align: center;
      padding: clamp(25px, 6vw, 65px) 18px;
      animation: contentAppear 1.5s ease both;
    }

    .eyebrow {
      margin-bottom: 28px;
      font-size: clamp(9px, 1.5vw, 12px);
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #55483b;
    }

    .names {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 15px;
      color: #4b3d32;
      line-height: 1.1;
    }

    .name {
      font-family: 'Bodoni Moda', serif;
      font-size: clamp(42px, 9vw, 88px);
      font-weight: 400;
      letter-spacing: -2px;
    }

    .ampersand {
      font-family: 'Italianno', cursive;
      font-size: clamp(38px, 7vw, 68px);
      font-weight: 400;
    }

    .wedding-date {
      margin-top: 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(10px, 1.6vw, 13px);
      font-weight: 400;
      letter-spacing: 5px;
      color: #55483b;
    }

    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 42px;
      min-height: 46px;
      padding: 0 30px;
      border: 1px solid rgba(79, 63, 48, 0.65);
      color: #4b3d32;
      background: rgba(255, 252, 246, 0.28);
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition:
        background 0.35s ease,
        color 0.35s ease;
    }

    .open-button:hover {
      background: #4b3d32;
      color: #fffaf2;
    }

    @keyframes contentAppear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .envelope-stage {
        width: 100%;
        aspect-ratio: 3 / 4;
      }

      .envelope-image {
        object-fit: contain;
      }

      .envelope-hint {
        bottom: 8%;
        font-size: 9px;
        letter-spacing: 2px;
      }

      .eyebrow {
        letter-spacing: 3px;
        margin-bottom: 24px;
      }

      .names {
        flex-direction: column;
        gap: 0;
      }

      .name {
        font-size: clamp(48px, 13vw, 72px);
      }

      .ampersand {
        font-size: 42px;
        line-height: 1;
      }

      .wedding-date {
        margin-top: 25px;
        letter-spacing: 3px;
      }

      .open-button {
        margin-top: 32px;
        padding: 0 22px;
        letter-spacing: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- FIRST SCREEN: CLOSED ENVELOPE -->

  <section class="envelope-screen" id="envelopeScreen">
    <div class="envelope-stage">

      <img
        src="images/envelope-closed.png"
        alt="Wedding invitation envelope"
        class="envelope-image"
        id="closedEnvelope"
      >

      <button
        class="seal-button"
        id="sealButton"
        type="button"
        aria-label="Open the wedding invitation"
      >
        <img
          src="images/seal.png"
          alt=""
        >
      </button>

      <p class="envelope-hint" id="envelopeHint">
        Click the seal to open
      </p>

    </div>
  </section>

  <!-- SECOND SCREEN: WEDDING COVER -->

  <main class="cover" id="weddingCover">
    <div class="cover-content">

      <p class="eyebrow">
        Together with their families
      </p>

      <div class="names">
        <span class="name">Oksana</span>
        <span class="ampersand">&amp;</span>
        <span class="name">Guy</span>
      </div>

      <p class="wedding-date">
        10 · 12 · 2026
      </p>

      <a
        class="open-button"
        href="invitation.html"
        id="openInvitation"
      >
        Open Invitation
      </a>

    </div>
  </main>

  <script>
    const envelopeScreen = document.getElementById('envelopeScreen');
    const closedEnvelope = document.getElementById('closedEnvelope');
    const sealButton = document.getElementById('sealButton');
    const envelopeHint = document.getElementById('envelopeHint');
    const weddingCover = document.getElementById('weddingCover');

    sealButton.addEventListener('click', function () {
      sealButton.classList.add('hide');
      envelopeHint.style.opacity = '0';
      closedEnvelope.classList.add('fade');

      window.setTimeout(function () {
        envelopeScreen.classList.add('hide');
        weddingCover.classList.add('show');
        document.body.style.overflow = 'auto';
      }, 900);
    });
  </script>

</body>
</html>
```
